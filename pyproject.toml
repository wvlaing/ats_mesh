[project]
name = "ats-mesh"
version = "0.1.0"
description = "Pull open roles from many company career sites into one filtered spreadsheet"
readme = "README.md"
authors = [
    { name = "wvlaing", email = "wvlaing24@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "curl-cffi>=0.16.3",
    "httpx[http2]>=0.28.1",
    "openpyxl>=3.1.5",
]

[project.scripts]
ats-mesh = "ats_mesh:main"

[dependency-groups]
dev = [
    "playwright>=1.63.0",  # only scripts/capture.py uses it
    "ruff>=0.16.9",
    "ty",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["E501"]  # the formatter wraps code; long comments and strings are fine

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["ANN"]
